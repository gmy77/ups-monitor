[package]
name = "ups-monitor"
version = "0.1.0"
edition = "2021"
description = "Monitor e dashboard per UPS USB HID (APC Back-UPS e compatibili)"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
pbkdf2 = "0.12"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
